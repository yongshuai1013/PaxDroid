name: Build PaxDroid IPA (iOS 15)

on:
  push:
    paths:
      - 'PaxDroidApp/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build IPA
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK" \
            -o PaxDroid \
            PaxDroidApp/PaxDroidApp.swift \
            PaxDroidApp/ContentView.swift \
            -framework SwiftUI -framework Foundation -framework UIKit
          
          mkdir -p Payload/PaxDroid.app
          cp PaxDroid Payload/PaxDroid.app/
          cat > Payload/PaxDroid.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.paxdroid.app</string>
              <key>CFBundleName</key>
              <string>PaxDroid</string>
              <key>CFBundleExecutable</key>
              <string>PaxDroid</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
          </dict>
          </plist>
          PLIST
          
          zip -r PaxDroid-iOS15.ipa Payload/
          ls -lh PaxDroid-iOS15.ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaxDroid-iOS15
          path: PaxDroid-iOS15.ipa
