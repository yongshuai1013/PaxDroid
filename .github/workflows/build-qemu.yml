name: Build QEMU for iOS

on:
  workflow_dispatch:

jobs:
  build-qemu:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - name: 運行 UTM 官方編譯腳本
        run: |
          cd build
          chmod +x build_dependencies.sh
          # UTM 官方腳本，會下載 QEMU（utmapp/qemu fork）和依賴並編譯
          # -p ios -a arm64 是默認值
          # 注意：腳本會從 utmapp/qemu 下載，不是上游
          ./build_dependencies.sh -p ios -a arm64 2>&1 | tail -100
      
      - name: 上傳產物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-sysroot
          path: sysroot-ios-arm64/
