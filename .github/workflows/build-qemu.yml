name: Build QEMU for iOS

on:
  workflow_dispatch:  # 手動觸發

jobs:
  build-qemu:
    runs-on: macos-latest
    timeout-minutes: 360  # 6 小時
    steps:
      - uses: actions/checkout@v4
      
      - name: 下載 QEMU 源碼
        run: |
          curl -L -o qemu.tar.xz https://download.qemu.org/qemu-11.0.4.tar.xz
          tar -xf qemu.tar.xz
          ls qemu-11.0.4/ | head -5
      
      - name: 配置 QEMU (iOS aarch64)
        run: |
          cd qemu-11.0.4
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          CFLAGS="-arch arm64 -isysroot $SDK -mios-version-min=15.0 -O2"
          LDFLAGS="-arch arm64 -isysroot $SDK -mios-version-min=15.0"
          
          # 參考 Husk 的做法：用 --extra-cflags/--extra-ldflags 傳 iOS 參數
          # 不用 --cross-file（QEMU 的 configure 不認）
          ./configure \
            --target-list=aarch64-softmmu \
            --cross-prefix="" \
            --enable-tcg \
            --disable-kvm \
            --enable-slirp \
            --disable-vnc --disable-gtk --disable-sdl --disable-cocoa \
            --disable-pie \
            --extra-cflags="$CFLAGS" \
            --extra-ldflags="$LDFLAGS"
      
      - name: 編譯
        run: |
          cd qemu-11.0.4
          make -j$(sysctl -n hw.ncpu)
      
      - name: 上傳配置日誌（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-config-log
          path: qemu-11.0.4/config.log
